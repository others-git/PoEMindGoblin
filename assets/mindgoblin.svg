<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    MindGoblin: a proper goblin under a battered Goldrim.

    Grit comes from asymmetry and damage, not from noise: one torn ear, one chipped
    tooth, a scarred brow, creased leather. Light comes from above-left, so the cap
    shades the eyes and the menace lives in that shadow. Still drawn for the 16px case -
    the silhouette (ears / head / oxblood cap) is what survives, and all the damage is
    detail that may vanish without the icon going soft.
  -->
  <defs>
    <radialGradient id="pit" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#221E18"/>
      <stop offset="0.7" stop-color="#131110"/>
      <stop offset="1" stop-color="#0A0908"/>
    </radialGradient>
    <linearGradient id="skin" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#8A9E45"/>
      <stop offset="0.55" stop-color="#5E7230"/>
      <stop offset="1" stop-color="#3A4A1E"/>
    </linearGradient>
    <linearGradient id="earskin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E8238"/>
      <stop offset="1" stop-color="#37461C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4DA6E"/>
      <stop offset="0.4" stop-color="#C9A227"/>
      <stop offset="0.8" stop-color="#8A6F22"/>
      <stop offset="1" stop-color="#5E4A15"/>
    </linearGradient>
    <linearGradient id="leather" x1="0.3" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#6E2818"/>
      <stop offset="0.55" stop-color="#4A1810"/>
      <stop offset="1" stop-color="#2E0D08"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#pit)"/>
  <rect x="3" y="3" width="250" height="250" rx="53" fill="none"
        stroke="#2A2018" stroke-width="6"/>

  <!-- Ears: long, swept back, and NOT a matching pair - the left one has been bitten. -->
  <g stroke="#1E2810" stroke-width="4" stroke-linejoin="round">
    <path d="M80 132 L10 92 L34 124 L22 122 C34 156 52 176 84 184 Z" fill="url(#earskin)"/>
    <path d="M176 132 L246 90 C240 138 220 172 172 184 Z" fill="url(#earskin)"/>
  </g>
  <!-- inner-ear shadow -->
  <path d="M78 142 L38 116 C48 144 62 164 82 172 Z" fill="#2A3614" opacity="0.8"/>
  <path d="M178 142 L218 114 C210 144 196 164 174 172 Z" fill="#2A3614" opacity="0.8"/>

  <!-- Head: lumpy, wider at the jaw than a clean oval would be. -->
  <path d="M128 82 C168 82 192 112 190 150 C189 172 180 192 166 204
           C154 214 143 220 128 220 C113 220 100 214 88 203
           C75 191 67 172 66 150 C64 112 88 82 128 82 Z"
        fill="url(#skin)" stroke="#1E2810" stroke-width="4"/>

  <!-- Cap shadow across the face: the light is above, the Goldrim is in the way. -->
  <path d="M67 138 C90 150 166 150 189 138 C189 130 188 124 187 118 L69 118
           C68 124 67 130 67 138 Z" fill="#26310F" opacity="0.55"/>

  <!-- Cheekbone light -->
  <path d="M84 168 C90 178 100 186 110 189 C98 190 86 182 80 170 Z" fill="#9DB055" opacity="0.5"/>
  <path d="M172 168 C166 178 156 186 146 189 C158 190 170 182 176 170 Z" fill="#9DB055" opacity="0.35"/>

  <!-- Warts -->
  <circle cx="82" cy="162" r="4" fill="#4A5C24"/>
  <circle cx="80.5" cy="160.5" r="1.6" fill="#8A9E45"/>
  <circle cx="176" cy="156" r="3.4" fill="#4A5C24"/>
  <circle cx="175" cy="155" r="1.3" fill="#8A9E45"/>

  <!-- Brow: heavy, uneven, one side scarred. -->
  <g fill="#1E2810">
    <path d="M82 134 L122 142 L120 156 L84 150 Z"/>
    <path d="M174 132 L134 142 L136 156 L172 148 Z"/>
  </g>
  <!-- scar through the right brow and down the cheek -->
  <g stroke="#31421A" stroke-width="4" stroke-linecap="round">
    <path d="M158 128 L154 168"/>
    <path d="M150 148 L162 152"/>
  </g>

  <!-- Eyes: sunk in the cap's shadow, lit amber, glaring inward. -->
  <path d="M88 150 C95 144 111 146 118 154 C115 164 98 167 90 161 Z" fill="#0E0C07"/>
  <path d="M168 148 C161 143 145 145 138 153 C141 163 158 166 166 160 Z" fill="#0E0C07"/>
  <path d="M92 152 C98 148 110 149 115 155 C112 162 98 163 92 158 Z" fill="#F2C446"/>
  <path d="M164 150 C158 147 146 148 141 154 C144 161 158 162 164 157 Z" fill="#F2C446"/>
  <ellipse cx="104" cy="155" rx="2.8" ry="4.6" fill="#120D04"/>
  <ellipse cx="152" cy="154" rx="2.8" ry="4.6" fill="#120D04"/>


  <!-- Grin: wide, mean, snaggled.
       Everything in a mouth is ROOTED or it reads as debris. The mouth is one dark
       crescent; the upper teeth are clipped to it so they hang from the lip instead of
       floating in the black; the fangs are planted in the lower lip and rise past it;
       and the nose is drawn last so it hangs over the middle of the grin. -->
  <clipPath id="mouth">
    <path d="M84 172 C98 198 158 200 172 170 C172 194 152 208 128 208
             C104 208 87 194 84 172 Z"/>
  </clipPath>
  <!-- High enough that green jaw shows BELOW it: flush with the chin, the dark of the
       mouth merged with the dark of the background and the face just ended in teeth. -->
  <path d="M84 172 C98 198 158 200 172 170 C172 194 152 208 128 208
           C104 208 87 194 84 172 Z" fill="#120D04" stroke="#1E2810" stroke-width="3"/>
  <!-- upper teeth: generous overshoot upward, cut clean at the lip by the clip -->
  <g clip-path="url(#mouth)" fill="#E8DCB0" stroke="#1E2810" stroke-width="2">
    <path d="M90 164 L104 166 L99 192 Z"/>
    <path d="M108 168 L121 170 L115 194 Z"/>
    <!-- the chipped one: broken flat, not pointed -->
    <path d="M126 170 L139 171 L137 186 L130 187 Z"/>
    <path d="M144 170 L157 168 L152 193 Z"/>
    <path d="M161 166 L172 162 L168 188 Z"/>
  </g>
  <!-- underbite fangs, rooted below the lip line and rising past it. The right one sits
       tighter and shorter so the nose can hang over it. -->
  <g fill="#F2E8C0" stroke="#1E2810" stroke-width="3" stroke-linejoin="round">
    <path d="M96 198 L103 172 L113 196 Z"/>
    <path d="M162 196 L156 172 L147 194 Z"/>
  </g>

  <!-- Nose: long, hooked, broken to the left, with a shine on the bridge. -->
  <path d="M129 142 C142 156 160 184 152 200 C147 209 128 211 120 202
           C111 192 112 178 118 166 C114 160 116 150 129 142 Z"
        fill="#6E8238" stroke="#1E2810" stroke-width="4" stroke-linejoin="round"/>
  <path d="M129 142 C142 156 160 184 152 200 C149 205 143 208 137 209
           C146 194 138 166 126 148 Z" fill="#3A4A1E" opacity="0.7"/>
  <path d="M124 152 C120 160 118 172 122 182" fill="none" stroke="#9DB055"
        stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="135" cy="197" rx="3" ry="4" fill="#26310F"/>

  <!-- Goldrim, as the game draws it: a slouched cap of wrinkled OXBLOOD leather (no
       gold band) with gold filigree embroidered over the left side and a gold ring
       clasped at the temple. At 16px what survives is the maroon dome and one gold
       glint, so the main filigree stroke is heavy and the ring sits at its end. -->
  <path d="M58 116 C48 58 88 28 128 30 C170 32 204 60 198 110
           C196 118 190 122 184 120 C186 124 180 128 172 124
           C172 128 160 130 154 124 C150 130 138 130 134 124
           C128 130 114 128 112 122 C106 128 94 126 92 120
           C88 126 78 126 76 118 C72 124 62 122 58 116 Z"
        fill="url(#leather)" stroke="#1A0806" stroke-width="4" stroke-linejoin="round"/>

  <!-- Wrinkles: the right side is all folds, pulled toward where the leather bunches. -->
  <g fill="none" stroke="#2E0D08" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M146 38 C152 62 154 90 148 116"/>
    <path d="M162 44 C170 66 172 92 164 118"/>
    <path d="M178 56 C186 74 188 96 180 116"/>
    <path d="M132 34 C136 60 138 92 134 120"/>
  </g>
  <!-- fold highlights, one per crease, on the lit side of each -->
  <g fill="none" stroke="#7A3020" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M141 42 C146 64 148 90 143 112"/>
    <path d="M156 48 C163 68 165 92 158 114"/>
    <path d="M173 60 C180 76 182 96 175 112"/>
  </g>

  <!-- Upper-left sheen where the light lands, under the embroidery -->
  <path d="M72 60 C86 40 110 30 126 32 C106 38 86 50 76 72 Z" fill="#8A3A24" opacity="0.6"/>

  <!-- The gold filigree: wire scrollwork over the left panel. One heavy vine so it
       survives small, thin tendrils off it for the big sizes. Every curl is OPEN:
       closed loops up here read as digits, and the first draft spelled "68". -->
  <path d="M64 100 C66 76 80 52 104 42 C116 38 126 40 130 46"
        fill="none" stroke="#C9A227" stroke-width="5" stroke-linecap="round"/>
  <path d="M130 46 C134 52 130 58 124 56" fill="none" stroke="#C9A227"
        stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#E8C84A" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <path d="M72 80 C80 72 90 66 100 64 C106 63 110 66 108 70"/>
    <path d="M68 94 C76 92 82 86 84 80"/>
    <path d="M96 50 C100 58 98 66 92 72"/>
  </g>
  <g fill="#F4DA6E">
    <circle cx="66" cy="102" r="2.5"/>
    <circle cx="108" cy="69" r="2"/>
    <circle cx="124" cy="57" r="2"/>
  </g>

  <!-- The ring: a gold annulus stitched at the temple, clear of the scrollwork so it
       reads as a RING and not another curl. -->
  <circle cx="90" cy="96" r="9" fill="none" stroke="#C9A227" stroke-width="5.5"/>
  <circle cx="90" cy="96" r="9" fill="none" stroke="#F4DA6E" stroke-width="2"
          stroke-dasharray="8 22" transform="rotate(-50 90 96)"/>
  <path d="M90 84 L90 88" stroke="#8A6F22" stroke-width="4" stroke-linecap="round"/>

  <!-- Rolled hem: darker leather turned under, uneven where it has stretched. -->
  <path d="M58 116 C62 124 74 128 92 130 C116 133 148 133 172 128
           C186 125 194 120 198 112 C196 122 190 128 180 132
           C152 140 100 140 76 132 C66 128 60 122 58 116 Z"
        fill="#3A100A" stroke="#1A0806" stroke-width="3" stroke-linejoin="round"/>
</svg>
